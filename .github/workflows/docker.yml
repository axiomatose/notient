# Builds the Notient image and publishes it to ghcr.io. Manual only: Actions tab > "Docker image" > Run workflow.
name: Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (the commit's short SHA is always added)
        default: latest
      api_base_url:
        description: "Bake the web app in for this public address, e.g. https://notes.example.com. Empty builds the API alone"
        default: ""
      exact_repo:
        description: Where to fetch Exact from, for the web build
        default: expo/exact
      exact_ref:
        description: Exact branch, tag or commit
        default: main

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: notient

      # The web app is built by Exact, which the app finds two folders up from app/ (see app/exact.mjs).
      - name: Check out Exact
        if: inputs.api_base_url != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.exact_repo }}
          ref: ${{ inputs.exact_ref }}
          path: exact
          token: ${{ secrets.EXACT_TOKEN || github.token }}

      - name: Set up Bun
        if: inputs.api_base_url != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build the web app
        if: inputs.api_base_url != ''
        working-directory: notient/app
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          export SOCKET_URL="${API_BASE_URL/http/ws}"
          bun ../../exact/scripts/exact.mjs setup --platform web
          bun exact.mjs web-build --out dist
          cp -R dist/. ../server/web-dist/

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: notient/server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
