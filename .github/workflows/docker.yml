# Builds the Notient image (API + web app) and publishes it to ghcr.io. Manual only: Actions tab > "Docker image" > Run workflow.
name: Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (the commit's short SHA is always added)
        default: latest
      exact_repo:
        description: Where to fetch Exact from, for the web build
        default: expo/exact
      exact_ref:
        description: Exact branch, tag or commit
        default: main

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: notient

      # The web app is built by Exact, which the app finds two folders up from app/ (see app/exact.mjs).
      # It is built with a placeholder address; the server swaps in its PUBLIC_URL at start.
      - name: Check out Exact
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.exact_repo }}
          ref: ${{ inputs.exact_ref }}
          path: exact
          token: ${{ secrets.EXACT_TOKEN || github.token }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Find Exact's revision
        id: rev
        run: echo "sha=$(git -C exact rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache the web build's tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/hermes-lean-sys
            ~/.cache/exact
            notient/app/target
          key: web-${{ steps.rev.outputs.sha }}-${{ hashFiles('notient/app/app.json', 'notient/app/app.contract', 'notient/app/app.ts') }}
          restore-keys: |
            web-${{ steps.rev.outputs.sha }}-
            web-

      - name: Build the web app
        working-directory: notient/app
        env:
          API_BASE_URL: https://notient-placeholder.invalid
          SOCKET_URL: wss://notient-placeholder.invalid
        run: |
          bun ../../exact/scripts/exact.mjs setup --platform web
          bun exact.mjs web-build --out dist
          cp -R dist/. ../server/web-dist/

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: notient/server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
