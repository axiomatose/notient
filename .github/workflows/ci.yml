# Runs the API's tests. Manual for now: Actions tab > "CI" > Run workflow.
# Once the repository is public (free minutes), add the pull_request trigger below.
name: CI

on:
  workflow_dispatch:
  # pull_request:
  #   paths: ["server/**", ".github/workflows/ci.yml"]

permissions:
  contents: read

jobs:
  server:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
