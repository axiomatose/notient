# Builds the Mac app with Exact and uploads it as a downloadable artifact. Manual only: Actions tab > "Mac app" > Run workflow.
# Signed with the Developer ID Application certificate in the MAC_CERT_P12 secret and notarized with the App Store
# Connect API key (APPLE_API_KEY_P8 / _ID, APPLE_API_ISSUER_ID), so it opens on any Mac. Without MAC_CERT_P12 it is
# signed ad hoc: after downloading, clear the quarantine flag (xattr -cr Notient.app) or right-click > Open once.
name: Mac app

on:
  workflow_dispatch:
    inputs:
      exact_repo:
        description: Where to fetch Exact from
        default: expo/exact
      exact_ref:
        description: Exact branch, tag or commit
        default: main
      server:
        description: Address the app starts on (people can change it on the sign-in screen)
        default: https://notes.vanceprop.com

permissions:
  contents: read

jobs:
  mac:
    # xcode-27 is GitHub's image with Xcode 27 (Swift 6.4+), which Exact's Apple host needs; the macos-26 images stop at Xcode 26.6.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          path: notient

      - name: Check out Exact
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.exact_repo }}
          ref: ${{ inputs.exact_ref }}
          path: exact
          token: ${{ secrets.EXACT_TOKEN || github.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Exact pins its Rust toolchain in exact/rust-toolchain.toml; rustup reads it on first use.
      - name: Install Rust
        shell: bash
        working-directory: exact
        run: |
          rustup show
          rustup target add aarch64-apple-darwin

      - name: Install Exact's packages
        working-directory: exact
        run: bun install --frozen-lockfile

      # Rust builds from scratch take most of the run, so keep them. Saved even when the build fails, so a retry resumes.
      - name: Find Exact's revision
        id: rev
        shell: bash
        run: echo "sha=$(git -C exact rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore the build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/hermes-lean-sys
            ~/.cache/exact
            notient/app/target
            notient/app/.exact/shells
          key: mac-${{ steps.rev.outputs.sha }}-${{ hashFiles('notient/app/app.json', 'notient/app/app.contract', 'notient/app/app.ts') }}
          restore-keys: |
            mac-${{ steps.rev.outputs.sha }}-
            mac-

      - name: Set up the Mac toolchain
        working-directory: notient/app
        run: bun ../../exact/scripts/exact.mjs setup

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      # The certificate lives in a throwaway keychain that is deleted at the end of the job.
      - name: Import the signing certificate
        id: sign
        env:
          CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then echo "No MAC_CERT_P12 secret: building ad hoc."; exit 0; fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass=$(openssl rand -hex 16)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          sha=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | awk '{print $2}')
          if [ -z "$sha" ]; then echo "::error::No Developer ID Application identity in MAC_CERT_P12"; exit 1; fi
          echo "identity=$sha" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: Build the app
        working-directory: notient/app
        env:
          API_BASE_URL: ${{ inputs.server }}
          EXACT_DEVELOPER_ID: ${{ steps.sign.outputs.identity }}
          EXACT_IDENTITY: ${{ steps.sign.outputs.identity || '-' }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export SOCKET_URL="${API_BASE_URL/http/ws}"
          bun exact.mjs mac --release

      - name: Save the build cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/hermes-lean-sys
            ~/.cache/exact
            notient/app/target
            notient/app/.exact/shells
          key: mac-${{ steps.rev.outputs.sha }}-${{ hashFiles('notient/app/app.json', 'notient/app/app.contract', 'notient/app/app.ts') }}

      - name: Collect the build
        shell: bash
        run: |
          mkdir out
          app=$(find notient/app/target/clients -maxdepth 6 -name 'Notient.app' -path '*/macos/*' | head -1)
          echo "app: $app"
          echo "app=$app" >> "$GITHUB_ENV"
          codesign -dvv "$app" 2>&1 | grep -E "Authority|TeamIdentifier|flags" || true

      # Apple scans the app and, if it passes, the ticket is stapled on so it opens offline.
      - name: Notarize
        if: steps.sign.outputs.identity != ''
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$API_KEY_P8" ]; then echo "No App Store Connect key: skipping notarization."; exit 0; fi
          echo "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/key.p8"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/key.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" --wait --timeout 30m
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl -a -vv "$app"
          rm "$RUNNER_TEMP/key.p8"

      - name: Zip the app
        run: ditto -c -k --keepParent "$app" out/Notient-mac.zip && ls -la out

      - name: Remove the signing keychain
        if: always() && steps.sign.outputs.keychain != ''
        run: security delete-keychain "${{ steps.sign.outputs.keychain }}"

      - uses: actions/upload-artifact@v4
        with:
          name: notient-mac
          path: out/
          if-no-files-found: error
