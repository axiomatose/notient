# Self-hosting: copy to docker-compose.yml and .env.example to .env, then `docker compose up -d`.
# The image comes from ghcr.io (the "Docker image" workflow). If it was built with a web app inside,
# the API serves it; otherwise build the web app yourself (README, "Self-hosting") and keep the /web mount.
services:
  api:
    image: ghcr.io/axiomatose/notient:latest
    # To build from this checkout instead: replace the line above with
    # build: { context: ./server }
    user: "1000:1000"
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3301
      DATA_DIR: /data
      WEB_DIST: /web
      SQLITE_JOURNAL_MODE: DELETE
    ports:
      - "${API_PORT:-3301}:3301"
    volumes:
      - ./data:/data:Z
      - ./app/dist:/web:ro
