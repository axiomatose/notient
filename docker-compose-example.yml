# Self-hosting: copy to docker-compose.yml and .env.example to .env, then `docker compose up -d`.
# One container: the API and the web app, at the address you set as PUBLIC_URL in .env.
services:
  api:
    image: ghcr.io/axiomatose/notient:latest
    # To build from this checkout instead: replace the line above with
    # build: { context: ./server }
    user: "1000:1000"
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3301
      DATA_DIR: /data
      SQLITE_JOURNAL_MODE: DELETE
    ports:
      - "${API_PORT:-3301}:3301"
    volumes:
      - ./data:/data:Z
